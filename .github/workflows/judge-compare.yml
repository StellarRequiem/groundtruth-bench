name: judge-compare

# OPT-IN ONLY — manual dispatch. Runs a direct Anthropic-SDK LLM-as-judge faithfulness scorer + a metered
# LLM API INSIDE the disposable runner, never a developer host. Needs the repo secret ANTHROPIC_API_KEY.
# The G4 head-to-head baseline; carries NO weight in the byte-identity/commitment claims.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "How many items to judge (metered — keep small)"
        default: "12"

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GroundTruth + anthropic SDK
        run: pip install -e . anthropic
      - name: Host-safe sanity (GroundTruth re-run byte-identical; no API)
        run: python tools/judge_compare.py --groundtruth-only
      - name: LLM-judge vs GroundTruth reproducibility (metered)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JUDGE_SAMPLE: ${{ inputs.sample }}
        run: python tools/judge_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: judge-compare
          path: judge_compare.json
