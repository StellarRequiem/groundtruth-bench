[project]
name = "groundtruth-bench"
version = "0.1.0"
description = "Contamination-committed, deterministically-scored, byte-reproducible citation-faithfulness benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # GitHub-pinned, NOT PyPI: `grounded-check` / our `verity-core` are not on PyPI, and the PyPI
  # name `verity-core` is an unrelated third-party package. Direct git refs install OUR code.
  "grounded-check @ git+https://github.com/StellarRequiem/grounded",
  "verity-core @ git+https://github.com/StellarRequiem/verity-core",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
groundtruth = "groundtruth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["groundtruth"]
